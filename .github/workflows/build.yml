# Build & push ghcr.io/gufuth/pz-faceswap-gpu (:facefusion, then :latest on top of it).
name: build-faceswap-image
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk + move Docker to the big partition
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/.ghcup
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile || true
          sudo systemctl stop docker || true
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push :facefusion (Classic)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: facefusion
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/pz-faceswap-gpu:facefusion
            ghcr.io/${{ github.repository_owner }}/pz-faceswap-gpu:facefusion-${{ github.sha }}

      - name: Build & push :latest (Classic + Rebuild)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/pz-faceswap-gpu:latest
            ghcr.io/${{ github.repository_owner }}/pz-faceswap-gpu:${{ github.sha }}

      - run: df -h
